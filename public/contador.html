<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contador de Votos - Producción</title>
  <link rel="stylesheet" href="/css/produccion-contador.css" />
</head>
<body>
  <header>
    <h1>Contador de Votos — Producción</h1>

    <div class="actions">
      <button id="addCounterBtn" class="primary">Agregar contador</button>
      <button id="resetAllBtn">Reiniciar votos</button>
      <button id="deleteAllBtn" class="danger">Borrar todo</button>
    </div>
  </header>

  <main id="counterGrid" class="grid"></main>

  <div id="modalBg" class="modal-bg">
    <div class="modal">
      <h2>Nuevo contador</h2>
      <input id="counterName" type="text" placeholder="Nombre del participante" />

      <div class="modal-actions">
        <button id="cancelBtn">Cancelar</button>
        <button id="createCounterBtn" class="primary">Crear</button>
      </div>
    </div>
  </div>

  <script src="/js/produccion-contador.js"></script>
</body>
</html>
